openapi: 3.0.0

info:
  title: MiniBlog API
  description: API REST para gestionar autores y posts
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local

paths:

  /authors:
    get:
      summary: Obtener todos los autores
      responses:
        '200':
          description: Lista de autores

    post:
      summary: Crear un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Juan Pérez
                email:
                  type: string
                  example: juan@example.com
                bio:
                  type: string
                  example: Desarrollador backend
      responses:
        '201':
          description: Autor creado
        '400':
          description: Datos inválidos o email duplicado

  /authors/{id}:
    get:
      summary: Obtener un autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Autor encontrado
        '400':
          description: ID inválido
        '404':
          description: Autor no encontrado

    put:
      summary: Actualizar un autor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Juan Pérez
                email:
                  type: string
                  example: juan@example.com
                bio:
                  type: string
                  example: Desarrollador backend
      responses:
        '200':
          description: Autor actualizado
        '400':
          description: Datos inválidos o email duplicado
        '404':
          description: Autor no encontrado

    delete:
      summary: Eliminar un autor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '204':
          description: Autor eliminado
        '400':
          description: ID inválido
        '404':
          description: Autor no encontrado

  /posts:
    get:
      summary: Obtener todos los posts
      responses:
        '200':
          description: Lista de posts

    post:
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - author_id
              properties:
                title:
                  type: string
                  example: Introducción a Node.js
                content:
                  type: string
                  example: Node.js es un runtime de JavaScript
                author_id:
                  type: integer
                  example: 1
                published:
                  type: boolean
                  example: false
      responses:
        '201':
          description: Post creado
        '400':
          description: Datos inválidos o autor inexistente

  /posts/{id}:
    get:
      summary: Obtener un post por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Post encontrado
        '400':
          description: ID inválido
        '404':
          description: Post no encontrado

    put:
      summary: Actualizar un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - author_id
              properties:
                title:
                  type: string
                  example: Introducción a Node.js
                content:
                  type: string
                  example: Node.js es un runtime de JavaScript
                author_id:
                  type: integer
                  example: 1
                published:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Post actualizado
        '400':
          description: Datos inválidos o autor inexistente
        '404':
          description: Post no encontrado

    delete:
      summary: Eliminar un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '204':
          description: Post eliminado
        '400':
          description: ID inválido
        '404':
          description: Post no encontrado

  /posts/author/{authorId}:
    get:
      summary: Obtener posts de un autor
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Lista de posts del autor
        '400':
          description: ID inválido